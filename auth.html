<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — TestVision</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="nav">
  <div class="nav-inner container">
    <a href="/" class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">TestVision</span>
    </a>
    <nav class="nav-links">
      <a href="index.html#features">Возможности</a>
      <a href="pricing.html">Тарифы</a>
      <a href="download.html">Скачать</a>
    </nav>
    <div class="nav-actions">
      <a href="index.html" class="btn btn-ghost">На главную</a>
    </div>
  </div>
</header>

<div class="page">
  <div class="container page-narrow">
    <h1 class="page-title">Добро пожаловать</h1>
    <p class="page-sub">Войди или создай аккаунт</p>

    <div class="card">
      <div class="form-tabs">
        <button class="active" data-tab="login">Вход</button>
        <button data-tab="register">Регистрация</button>
      </div>

      <form id="form-login">
        <div class="field">
          <label>Email</label>
          <input class="input" type="email" id="li-email" autocomplete="email" required>
        </div>
        <div class="field">
          <label>Пароль</label>
          <input class="input" type="password" id="li-pass" autocomplete="current-password" required>
        </div>
        <div class="form-err" id="li-err"></div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Войти</button>
      </form>

      <form id="form-register" style="display:none">
        <div class="field">
          <label>Имя</label>
          <input class="input" type="text" id="rg-name" required>
        </div>
        <div class="field">
          <label>Email</label>
          <input class="input" type="email" id="rg-email" autocomplete="email" required>
        </div>
        <div class="field">
          <label>Пароль</label>
          <input class="input" type="password" id="rg-pass" autocomplete="new-password" minlength="6" required>
        </div>
        <div class="form-err" id="rg-err"></div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Создать аккаунт</button>
      </form>
    </div>
  </div>
</div>

<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
